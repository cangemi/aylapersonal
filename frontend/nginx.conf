map $status $ayla_asset_cache {
    200 "public, max-age=31536000, immutable";
    default "no-store";
}
log_format ayla_safe 'status=$status method=$request_method duration=$request_time bytes=$bytes_sent';
access_log /var/log/nginx/access.log ayla_safe;

server {
    listen 80;
    server_name _;
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 40m;
    ssl_certificate /var/lib/ayla-certs/server.crt;
    ssl_certificate_key /var/lib/ayla-certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
    location /api/ {
        proxy_pass http://host.docker.internal:8080;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store" always;
    }
    location /actuator/health {
        proxy_pass http://host.docker.internal:8080;
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control $ayla_asset_cache always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /index.html {
        add_header Cache-Control "no-store, max-age=0" always;
    }
    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
    }
    location = /manifest.webmanifest {
        try_files $uri =404;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
