global
    log stdout format raw local0
    maxconn 1024

defaults
    log global
    mode http
    timeout connect 5s
    timeout client 620s
    timeout server 610s
    timeout http-request 15s
    timeout queue 5s
    # Only retry when the request could not be sent. Never replay an uncertain mutation.
    retries 2
    retry-on conn-failure
    option redispatch 1
    option dontlognull
    log-format "status=%ST method=%HM backend=%b server=%s time_ms=%Ta bytes=%B"

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s
    hold obsolete 5s

frontend api
    bind :8080
    # Internal metrics must never be reachable through the public proxy.
    http-request deny deny_status 404 if { path_beg /actuator } !{ path -m str /actuator/health /actuator/health/liveness /actuator/health/readiness }
    http-request set-path /livez if { path -m str /actuator/health/liveness }
    http-request set-path /readyz if { path -m str /actuator/health /actuator/health/readiness }
    default_backend java

backend java
    balance leastconn
    option httpchk
    http-check send meth GET uri /readyz
    http-check expect status 200
    default-server check inter 5s fall 3 rise 2 resolvers docker init-addr none
    server-template api 1-8 api:8080

frontend telemetry
    bind :8404
    no log
    http-request use-service prometheus-exporter if { path /metrics }
    http-request return status 200 content-type text/plain string "ok" if { path /healthz }
    http-request deny deny_status 404
