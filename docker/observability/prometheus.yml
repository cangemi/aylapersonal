global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    environment: ayla-vps
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: ayla-api
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: [api]
        type: A
        port: 9091
        refresh_interval: 10s
  - job_name: loadbalancer
    static_configs:
      - targets: ['api-gateway:8404']
  - job_name: vps
    static_configs:
      - targets: ['node-exporter:9100']
  - job_name: containers
    static_configs:
      - targets: ['cadvisor:8080']
  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']
  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']
  - job_name: rabbitmq
    static_configs:
      - targets: ['rabbitmq:15692']
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  - job_name: probes
    metrics_path: /probe
    params:
      module: [http_ok]
    static_configs:
      - targets:
          - http://api-gateway:8080/actuator/health/readiness
          - http://frontend:3000/healthz
          - http://whatsapp:4000/health
          - http://hermes:8642/health
          - http://loki:3100/ready
          - http://tempo:3200/ready
          - http://grafana:3000/api/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
