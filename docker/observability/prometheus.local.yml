global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels: {environment: ayla-local}
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: ayla-api
    metrics_path: /actuator/prometheus
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics-token
    static_configs:
      - targets: ['host.docker.internal:9091']
        labels: {deployment: local}
  - job_name: vps
    static_configs:
      - targets: ['node-exporter:9100']
  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']
  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']
  - job_name: rabbitmq
    static_configs:
      - targets: ['rabbitmq:15692']
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  - job_name: probes
    metrics_path: /probe
    params: {module: [http_ok]}
    static_configs:
      - targets:
          - http://host.docker.internal:8080/readyz
          - http://frontend:3000/healthz
          - http://whatsapp:4000/health
          - http://hermes:8642/health
          - http://loki:3100/ready
          - http://tempo:3200/ready
          - http://grafana:3000/api/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
