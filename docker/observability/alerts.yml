groups:
  - name: ayla-availability
    rules:
      - alert: AylaReplicaIndisponivel
        expr: up{job="ayla-api"} == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: 'Réplica da API indisponível: {{ $labels.instance }}'}
      - alert: AylaSemReplicas
        expr: (sum(up{job="ayla-api"}) < 1) or absent(up{job="ayla-api"})
        for: 1m
        labels: {severity: critical}
        annotations: {summary: 'Nenhuma réplica da API disponível'}
      - alert: AylaMenosDeDuasReplicas
        expr: sum(up{job="ayla-api",deployment!="local"}) < 2
        for: 2m
        labels: {severity: warning}
        annotations: {summary: 'A API está sem redundância de réplicas'}
      - alert: AylaServicoIndisponivel
        expr: probe_success{job="probes"} == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: 'Verificação de saúde falhou: {{ $labels.instance }}'}
      - alert: AylaErrosElevados
        expr: sum(rate(http_server_requests_seconds_count{job="ayla-api",status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count{job="ayla-api"}[5m])), 0.01) > 0.05
        for: 5m
        labels: {severity: warning}
        annotations: {summary: 'Mais de 5% de respostas 5xx na API'}
      - alert: AylaPoolBancoSaturado
        expr: hikaricp_connections_pending{job="ayla-api"} > 0
        for: 2m
        labels: {severity: warning}
        annotations: {summary: 'Requisições aguardando conexão PostgreSQL'}
      - alert: AylaPostgresIndisponivel
        expr: pg_up{job="postgres"} == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: 'O exportador não consegue acessar o PostgreSQL'}
      - alert: AylaRedisIndisponivel
        expr: redis_up{job="redis"} == 0
        for: 1m
        labels: {severity: warning}
        annotations: {summary: 'O exportador não consegue acessar o Redis'}
  - name: ayla-host
    rules:
      - alert: VpsCpuAlta
        expr: 100 * (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 90
        for: 10m
        labels: {severity: warning}
        annotations: {summary: 'CPU acima de 90% por dez minutos'}
      - alert: VpsMemoriaAlta
        expr: 100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 90
        for: 5m
        labels: {severity: warning}
        annotations: {summary: 'Menos de 10% de memória disponível'}
      - alert: VpsDiscoCheio
        expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes < 0.15
        for: 5m
        labels: {severity: critical}
        annotations: {summary: 'Menos de 15% de disco disponível'}
      - alert: AylaExportadorIndisponivel
        expr: up{job=~"vps|containers|postgres|redis|rabbitmq|loadbalancer"} == 0
        for: 2m
        labels: {severity: warning}
        annotations: {summary: 'Coleta de métricas falhou: {{ $labels.job }}'}
