spring.application.name=ayla
spring.config.import=optional:file:.env[.properties]

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/ayla
spring.datasource.username=ayla
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=ayla
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# Actuator
management.endpoints.web.exposure.include=health,info
management.tracing.export.otlp.enabled=false
management.otlp.metrics.export.enabled=false
management.endpoint.health.probes.enabled=true

# Hermes local: inferência e pesquisa são executadas pelo agente.
ayla.hermes.base-url=${HERMES_BASE_URL:http://127.0.0.1:8642}
ayla.hermes.api-key=${HERMES_API_SERVER_KEY:}
ayla.hermes.timeout-seconds=${HERMES_TIMEOUT_SECONDS:180}

# The authenticated Principal supplies the user ID; no anonymous personal mode.
ayla.chat.owner-id=${AYLA_CHAT_OWNER_ID:local-owner}
ayla.auth.setup-key=${AYLA_AUTH_SETUP_KEY:}
spring.mvc.log-request-details=false
server.error.include-stacktrace=never

# OpenAPI / Swagger UI
springdoc.paths-to-match=/api/v1/**
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.default-models-expand-depth=-1


ayla.finance.bridge-key=${AYLA_FINANCE_BRIDGE_KEY:}

# Node WhatsApp bridge; keys stay on the servers, never in the frontend.
ayla.whatsapp.base-url=${WHATSAPP_BASE_URL:http://127.0.0.1:4000}
ayla.whatsapp.api-key=${AYLA_WHATSAPP_API_KEY:}

# Endpoint nativo de transcrição e limpeza de mídia no painel Hermes.
ayla.hermes.dashboard-url=${HERMES_DASHBOARD_URL:http://127.0.0.1:9119}
ayla.hermes.data-home=${HERMES_DATA_HOME:/opt/data}

# Pronúncias somente para voz: Nome=como se fala;Outro nome=pronúncia
ayla.hermes.voice.pronunciations=${AYLA_VOICE_PRONUNCIATIONS:}

ayla.web.allowed-origins=${AYLA_FRONTEND_ORIGINS:http://localhost:3000,http://localhost:5173}
ayla.web.base-url=${AYLA_WEB_BASE_URL:auto}

# Optional Google Calendar integration; the local agenda works without credentials.
ayla.calendar.google.client-id=${AYLA_GOOGLE_CLIENT_ID:}
ayla.calendar.google.client-secret=${AYLA_GOOGLE_CLIENT_SECRET:}
ayla.calendar.google.redirect-uri=${AYLA_GOOGLE_REDIRECT_URI:http://localhost:3000/api/v1/calendar/google/callback}
ayla.calendar.encryption-key=${AYLA_CALENDAR_ENCRYPTION_KEY:}

# Planning estimates for a continuously running Oracle A1 VM, not OCI billing data.
ayla.oracle.metrics.enabled=${AYLA_ORACLE_METRICS_ENABLED:false}
ayla.oracle.ocpus=${AYLA_ORACLE_OCPUS:2}
ayla.oracle.memory-gb=${AYLA_ORACLE_MEMORY_GB:12}
ayla.oracle.cpu-monthly-hours=${AYLA_ORACLE_CPU_MONTHLY_HOURS:1500}
ayla.oracle.memory-monthly-hours=${AYLA_ORACLE_MEMORY_MONTHLY_HOURS:9000}
ayla.oracle.time-zone=${AYLA_ORACLE_TIME_ZONE:America/Sao_Paulo}
