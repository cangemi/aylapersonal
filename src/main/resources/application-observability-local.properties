# API runs on the host; only the collector has this key, never the frontend.
management.server.port=9091
management.server.address=0.0.0.0
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never
management.metrics.tags.application=ayla
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.maximum-expected-value.http.server.requests=600s
management.tracing.export.otlp.enabled=true
management.opentelemetry.tracing.export.otlp.endpoint=http://127.0.0.1:4318/v1/traces
management.tracing.sampling.probability=0.1
management.otlp.metrics.export.enabled=false
logging.structured.format.console=ecs
logging.file.name=target/observability/logs/ayla.log
logging.structured.format.file=ecs
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=3
logging.logback.rollingpolicy.total-size-cap=40MB
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=ERROR
ayla.metrics.scrape-key=${AYLA_METRICS_SCRAPE_KEY:}
