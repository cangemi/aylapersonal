# Only this internal port exposes health details/metrics; never publish it to the host.
management.server.port=9091
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db
management.metrics.tags.application=ayla
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,500ms,1s,5s,30s,180s
management.metrics.distribution.maximum-expected-value.http.server.requests=600s
management.tracing.export.otlp.enabled=true
management.opentelemetry.tracing.export.otlp.endpoint=http://tempo:4318/v1/traces
management.tracing.sampling.probability=${TRACE_SAMPLING_PROBABILITY:0.1}
management.otlp.metrics.export.enabled=false
logging.structured.format.console=ecs
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=ERROR
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=210s
spring.threads.virtual.enabled=true
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:12}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.max-lifetime=600000
server.tomcat.max-connections=512
server.tomcat.accept-count=100
ayla.cluster.max-concurrent-chats=${MAX_CONCURRENT_CHATS:3}
