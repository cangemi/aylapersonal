
name: Build, publish and deploy Ayla

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ayla-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: Build ${{ matrix.component }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: env

    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            image: ayla-api
            context: .
            dockerfile: ./Dockerfile

          - component: frontend
            image: ayla-frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile

          - component: whatsapp
            image: ayla-whatsapp
            context: ./agentNode
            dockerfile: ./agentNode/Dockerfile

    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check Docker Hub credentials
        if: github.event_name != 'pull_request'
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "$DOCKERHUB_TOKEN" ]]; then
            echo "::error::Missing DOCKERHUB_TOKEN"
            exit 1
          fi

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: cangemi/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
            type=ref,event=branch,prefix=branch-
            type=ref,event=pr
            type=sha,format=long

      - name: Enable ARM64 emulation
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: cangemi
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.component == 'frontend' && format('VITE_GRAFANA_URL={0}', vars.GRAFANA_BROWSER_URL || 'http://localhost:3300/d/ayla-vps') || '' }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          provenance: mode=min

      - name: Record published image
        if: github.event_name != 'pull_request'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf '### Docker Hub\n\n%s\n\nDigest: %s\n' \
            "$IMAGE_TAGS" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to Oracle Cloud
    needs: images

    # Deploy automatico apenas na branch main.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: env

    steps:
      - name: Checkout deployment configuration
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail

          for name in VPS_SSH_KEY VPS_HOST_KEY VPS_HOST VPS_USER; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing $name"
              exit 1
            fi
          done

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Test SSH connection
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" \
            'echo "SSH OK"; docker info --format "{{.ServerVersion}}"; docker compose version'

      - name: Prepare deployment package
        run: |
          set -euo pipefail

          mkdir -p deployment

          cp compose.yaml deployment/
          cp compose.vps.yaml deployment/
          cp compose.observability.yaml deployment/
          cp compose.oracle-free.yaml deployment/

          cp -a docker deployment/
          cp -a scripts deployment/

          tar -czf ayla-deploy.tar.gz -C deployment .

      - name: Upload deployment package
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail

          scp \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            ayla-deploy.tar.gz \
            "$VPS_USER@$VPS_HOST:/tmp/ayla-deploy.tar.gz"

      - name: Deploy containers
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "bash -s -- '$DEPLOY_SHA'" <<'REMOTE'
          set -euo pipefail

          SHA="$1"
          TAG="sha-$SHA"

          cd /opt/ayla

          if [[ ! -f .env ]]; then
            echo "ERROR: /opt/ayla/.env not found"
            exit 1
          fi

          echo "Extracting deployment package..."
          tar -xzf /tmp/ayla-deploy.tar.gz -C /opt/ayla
          rm -f /tmp/ayla-deploy.tar.gz

          export AYLA_IMAGE_TAG="$TAG"
          export COMPOSE_PROJECT_NAME=ayla

          COMPOSE_FILES=(
            -f compose.yaml
            -f compose.vps.yaml
            -f compose.observability.yaml
            -f compose.oracle-free.yaml
          )

          echo "Validating Docker Compose..."
          docker compose "${COMPOSE_FILES[@]}" config --quiet

          echo "Checking application image references..."
          for spec in \
            "api:cangemi/ayla-api:$TAG" \
            "frontend:cangemi/ayla-frontend:$TAG" \
            "whatsapp:cangemi/ayla-whatsapp:$TAG"; do

            service="${spec%%:*}"
            expected="${spec#*:}"

            actual="$(
              docker compose "${COMPOSE_FILES[@]}" \
                config --format json |
                python3 -c "import json,sys; print(json.load(sys.stdin)['services']['$service'].get('image',''))"
            )"

            if [[ "$actual" != "$expected" ]]; then
              echo "ERROR: Wrong image for $service"
              echo "Expected: $expected"
              echo "Actual: $actual"
              exit 1
            fi
          done

          echo "Pulling application images..."
          docker pull "cangemi/ayla-api:$TAG"
          docker pull "cangemi/ayla-frontend:$TAG"
          docker pull "cangemi/ayla-whatsapp:$TAG"

          echo "Pulling infrastructure images..."
          docker compose "${COMPOSE_FILES[@]}" pull --ignore-buildable

          echo "Starting services..."
          docker compose "${COMPOSE_FILES[@]}" up -d --no-build

          echo "Waiting for service readiness..."
          docker compose "${COMPOSE_FILES[@]}" up \
            -d \
            --no-build \
            --wait \
            --wait-timeout 300

          echo "Container status:"
          docker compose "${COMPOSE_FILES[@]}" ps

          echo "Deployment completed successfully for $SHA"
          REMOTE

      - name: Deployment summary
        if: success()
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          echo "## Oracle Cloud deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Status: Success" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`$DEPLOY_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Target: Oracle Cloud ARM64" >> "$GITHUB_STEP_SUMMARY"
          echo "Project: ayla" >> "$GITHUB_STEP_SUMMARY"
          echo "Image tag: \`sha-$DEPLOY_SHA\`" >> "$GITHUB_STEP_SUMMARY"
